:root{--bg:#FBFAF9;--card:#fff;--ink:#221F1C;--muted:#746A61;--line:#DDD7CD;--gold1:#EECB6E;--gold2:#DDB04F}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;padding:16px}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px 28px;box-shadow:0 1px 2px rgba(20,17,15,.06),0 12px 32px rgba(20,17,15,.06)}

input[type=password]{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#FFFCF6;color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--gold2);outline-offset:1px}
.rem{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:12px 0 18px}
button{width:100%;font:inherit;font-weight:600;font-size:15px;color:#1A1405;border:0;border-radius:10px;padding:12px;cursor:pointer;background:linear-gradient(var(--gold1),var(--gold2));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 0 0 1px rgba(146,108,34,.4)}

.foot{font-size:12px;color:var(--muted);margin-top:18px}
