  function show(){document.getElementById('gate').hidden=false;document.getElementById('pw').focus()}
  var saved=store();

    var rem=document.getElementById('rm').checked,pw=document.getElementById('pw').value.trim();
    (B?viaSheet(pw):derive(pw)).then(function(k){return dec(k).then(function(h){return crypto.subtle.exportKey('raw',k).then(function(raw){save(b(raw),rem);render(h)})})}).catch(function(){go.disabled=false;err.textContent="That passcode didn't work."})
  });
})();
