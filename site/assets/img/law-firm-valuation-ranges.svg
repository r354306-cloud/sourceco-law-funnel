<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 534" width="760" height="534" role="img" aria-label="Law firm valuation ranges by firm type" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Law firm valuation ranges by firm type</title><rect width="760" height="534" rx="18" fill="#FFFFFF"/><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EECB6E"/><stop offset="1" stop-color="#C9952F"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1714"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C9952F"/></marker></defs><rect x="36" y="34" width="18" height="3" rx="1.5" fill="#C9952F"/><text x="62" y="40" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.6">SOURCECO RESEARCH</text><text x="36" y="76" font-size="23" font-weight="700" fill="#1A1714" text-anchor="start">Law firm valuation ranges by firm type</text><text x="36" y="102" font-size="15" font-weight="400" fill="#6B625A" text-anchor="start">Small practices are priced on fees. Profitable firms are priced on adjusted EBITDA.</text><text x="36" y="150" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.4">PRICED ON ANNUAL FEES</text><line x1="270" y1="164" x2="270" y2="242" stroke="#E4DED4" stroke-width="1.5"/><text x="270.0" y="262" font-size="13.5" font-weight="600" fill="#6B625A" text-anchor="middle">0x</text><line x1="419" y1="164" x2="419" y2="242" stroke="#E4DED4" stroke-width="1.5"/><text x="418.66666666666663" y="262" font-size="13.5" font-weight="600" fill="#6B625A" text-anchor="middle">1x</text><line x1="567" y1="164" x2="567" y2="242" stroke="#E4DED4" stroke-width="1.5"/><text x="567.3333333333333" y="262" font-size="13.5" font-weight="600" fill="#6B625A" text-anchor="middle">2x</text><line x1="716" y1="164" x2="716" y2="242" stroke="#E4DED4" stroke-width="1.5"/><text x="716.0" y="262" font-size="13.5" font-weight="600" fill="#6B625A" text-anchor="middle">3x</text><text x="36" y="192" font-size="15" font-weight="500" fill="#3F3B36" text-anchor="start">Clio rule of thumb</text><rect x="344" y="174" width="372" height="26" rx="13" fill="#F6F2EC" stroke="#D9D0C2" stroke-width="1.5"/><text x="702.0" y="192" font-size="14" font-weight="700" fill="#3F3B36" text-anchor="end">0.5x to 3.0x</text><text x="36" y="230" font-size="15" font-weight="700" fill="#1A1714" text-anchor="start">Solo and small practices</text><rect x="344" y="210" width="149" height="30" rx="15" fill="url(#gg)"/><text x="505.0" y="231" font-size="15" font-weight="800" fill="#1A1714" text-anchor="start">0.5x to 1.5x</text><text x="36" y="300" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.4">PRICED ON ADJUSTED EBITDA</text><line x1="270" y1="314" x2="270" y2="442" stroke="#E4DED4" stroke-width="1.5"/><text x="270.0" y="462" font-size="13.5" font-weight="600" fill="#6B625A" text-anchor="middle">0x</text><line x1="359" y1="314" x2="359" y2="442" stroke="#E4DED4" stroke-width="1.5"/><text x="359.2" y="462" font-size="13.5" font-weight="600" fill="#6B625A" text-anchor="middle">2x</text><line x1="448" y1="314" x2="448" y2="442" stroke="#E4DED4" stroke-width="1.5"/><text x="448.4" y="462" font-size="13.5" font-weight="600" fill="#6B625A" text-anchor="middle">4x</text><line x1="538" y1="314" x2="538" y2="442" stroke="#E4DED4" stroke-width="1.5"/><text x="537.5999999999999" y="462" font-size="13.5" font-weight="600" fill="#6B625A" text-anchor="middle">6x</text><line x1="627" y1="314" x2="627" y2="442" stroke="#E4DED4" stroke-width="1.5"/><text x="626.8" y="462" font-size="13.5" font-weight="600" fill="#6B625A" text-anchor="middle">8x</text><line x1="716" y1="314" x2="716" y2="442" stroke="#E4DED4" stroke-width="1.5"/><text x="716.0" y="462" font-size="13.5" font-weight="600" fill="#6B625A" text-anchor="middle">10x</text><text x="36" y="346" font-size="15" font-weight="700" fill="#1A1714" text-anchor="start">Profitable smaller firms</text><rect x="404" y="326" width="89" height="30" rx="15" fill="url(#gg)"/><text x="391.79999999999995" y="347" font-size="15" font-weight="800" fill="#1A1714" text-anchor="end">3x to 5x</text><text x="36" y="386" font-size="15" font-weight="700" fill="#1A1714" text-anchor="start">Larger firms</text><rect x="493" y="366" width="134" height="30" rx="15" fill="url(#gg)"/><text x="481.0" y="387" font-size="15" font-weight="800" fill="#1A1714" text-anchor="end">high single digits</text><text x="36" y="426" font-size="15" font-weight="700" fill="#1A1714" text-anchor="start">Largest PI platforms</text><rect x="582" y="406" width="134" height="30" rx="15" fill="#14110F"/><text x="702.0" y="427" font-size="14.5" font-weight="800" fill="#EECB6E" text-anchor="end">7x to 10x</text><text x="36" y="492" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Sources: Clio (revenue rule of thumb); Private Equity Legal Alliance 2026 guide (EBITDA ranges).</text><text x="36" y="510" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Directional, not an appraisal.</text></svg>
