<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 504" width="760" height="504" role="img" aria-label="California Rule 1.17 compared with the ABA model rule on selling a law practice" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>California Rule 1.17 compared with the ABA model rule on selling a law practice</title><rect width="760" height="504" rx="18" fill="#FFFFFF"/><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EECB6E"/><stop offset="1" stop-color="#C9952F"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1714"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C9952F"/></marker></defs><rect x="36" y="34" width="18" height="3" rx="1.5" fill="#C9952F"/><text x="62" y="40" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.6">SOURCECO RESEARCH</text><text x="36" y="76" font-size="23" font-weight="700" fill="#1A1714" text-anchor="start">California Rule 1.17 vs the ABA model rule</text><text x="36" y="102" font-size="15" font-weight="400" fill="#6B625A" text-anchor="start">Same goal, stricter rules on what you sell and how clients agree.</text><rect x="36" y="132" width="688" height="40" rx="10" fill="#14110F"/><text x="52" y="158" font-size="13" font-weight="400" fill="#FFFCF6" text-anchor="start"></text><text x="222" y="158" font-size="12.5" font-weight="700" fill="#EECB6E" text-anchor="start" letter-spacing="1.4">CALIFORNIA</text><text x="470" y="158" font-size="12.5" font-weight="700" fill="#D9D0C2" text-anchor="start" letter-spacing="1.4">ABA MODEL RULE</text><rect x="36" y="186" width="688" height="42" rx="10" fill="#F6F2EC"/><text x="52" y="212" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">What you can sell</text><text x="222" y="212" font-size="14" font-weight="600" fill="#1A1714" text-anchor="start">All or substantially all</text><text x="470" y="212" font-size="14" font-weight="400" fill="#3F3B36" text-anchor="start">Whole practice or a practice area</text><rect x="36" y="236" width="688" height="42" rx="10" fill="#FFFFFF"/><text x="52" y="262" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Client consent</text><text x="222" y="262" font-size="14" font-weight="600" fill="#1A1714" text-anchor="start">Written, before the transfer</text><text x="470" y="262" font-size="14" font-weight="400" fill="#3F3B36" text-anchor="start">Presumed after 90 days, no objection</text><rect x="36" y="286" width="688" height="42" rx="10" fill="#F6F2EC"/><text x="52" y="312" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Notice timing</text><text x="222" y="312" font-size="14" font-weight="600" fill="#1A1714" text-anchor="start">90+ days before the transfer</text><text x="470" y="312" font-size="14" font-weight="400" fill="#3F3B36" text-anchor="start">Written notice to each client</text><rect x="36" y="336" width="688" height="42" rx="10" fill="#FFFFFF"/><text x="52" y="362" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Client fees</text><text x="222" y="362" font-size="14" font-weight="600" fill="#1A1714" text-anchor="start">No increase solely due to sale</text><text x="470" y="362" font-size="14" font-weight="400" fill="#3F3B36" text-anchor="start">No increase because of the sale</text><rect x="36" y="394" width="688" height="42" rx="10" fill="#FBF3DF"/><text x="52" y="420" font-size="14" font-weight="600" fill="#1A1714" text-anchor="start">California also bars sharing confidential client information with a nonlawyer in the sale.</text><text x="36" y="462" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Sources: State Bar of California, Rule 1.17 (effective Nov 1, 2018); ABA Model Rule 1.17. Not</text><text x="36" y="480" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">legal advice.</text></svg>
