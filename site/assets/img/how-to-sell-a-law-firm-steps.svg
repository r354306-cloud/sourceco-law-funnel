<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 434" width="760" height="434" role="img" aria-label="Selling a law firm steps" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Selling a law firm steps</title><rect width="760" height="434" rx="18" fill="#FFFFFF"/><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EECB6E"/><stop offset="1" stop-color="#C9952F"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1714"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C9952F"/></marker></defs><rect x="36" y="34" width="18" height="3" rx="1.5" fill="#C9952F"/><text x="62" y="40" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.6">SOURCECO RESEARCH</text><text x="36" y="76" font-size="23" font-weight="700" fill="#1A1714" text-anchor="start">Selling a law firm: from valuation to transition plan</text><text x="36" y="102" font-size="15" font-weight="400" fill="#6B625A" text-anchor="start">Six phases. Client notice and the handover decide how much of the price you keep.</text><rect x="36" y="138" width="216" height="92" rx="14" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/><circle cx="66" cy="184" r="16" fill="#14110F"/><text x="66" y="189" font-size="15" font-weight="800" fill="#FFFCF6" text-anchor="middle">1</text><text x="94" y="180" font-size="15.5" font-weight="800" fill="#1A1714" text-anchor="start">Value and prepare</text><text x="94" y="202" font-size="13.5" font-weight="500" fill="#6B625A" text-anchor="start">Range and data room</text><path d="M254 184H270" stroke="#1A1714" stroke-width="2" marker-end="url(#ar)"/><rect x="272" y="138" width="216" height="92" rx="14" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/><circle cx="302" cy="184" r="16" fill="#14110F"/><text x="302" y="189" font-size="15" font-weight="800" fill="#FFFCF6" text-anchor="middle">2</text><text x="330" y="180" font-size="15.5" font-weight="800" fill="#1A1714" text-anchor="start">Confidential talks</text><text x="330" y="202" font-size="13.5" font-weight="500" fill="#6B625A" text-anchor="start">No client names shared</text><path d="M490 184H506" stroke="#1A1714" stroke-width="2" marker-end="url(#ar)"/><rect x="508" y="138" width="216" height="92" rx="14" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/><circle cx="538" cy="184" r="16" fill="#14110F"/><text x="538" y="189" font-size="15" font-weight="800" fill="#FFFCF6" text-anchor="middle">3</text><text x="566" y="180" font-size="15.5" font-weight="800" fill="#1A1714" text-anchor="start">Letter of intent</text><text x="566" y="202" font-size="13.5" font-weight="500" fill="#6B625A" text-anchor="start">Price and terms agreed</text><rect x="36" y="250" width="216" height="92" rx="14" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/><circle cx="66" cy="296" r="16" fill="#14110F"/><text x="66" y="301" font-size="15" font-weight="800" fill="#FFFCF6" text-anchor="middle">4</text><text x="94" y="292" font-size="15.5" font-weight="800" fill="#1A1714" text-anchor="start">Diligence</text><text x="94" y="314" font-size="13.5" font-weight="500" fill="#6B625A" text-anchor="start">Files need client consent</text><path d="M254 296H270" stroke="#1A1714" stroke-width="2" marker-end="url(#ar)"/><rect x="272" y="250" width="216" height="92" rx="14" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/><circle cx="302" cy="296" r="16" fill="#14110F"/><text x="302" y="301" font-size="15" font-weight="800" fill="#FFFCF6" text-anchor="middle">5</text><text x="330" y="292" font-size="15.5" font-weight="800" fill="#1A1714" text-anchor="start">Client notice</text><text x="330" y="314" font-size="13.5" font-weight="500" fill="#6B625A" text-anchor="start">90 days to object</text><path d="M490 296H506" stroke="#1A1714" stroke-width="2" marker-end="url(#ar)"/><rect x="508" y="250" width="216" height="92" rx="14" fill="#14110F" stroke="#14110F" stroke-width="1.5"/><circle cx="538" cy="296" r="16" fill="#C9952F"/><text x="538" y="301" font-size="15" font-weight="800" fill="#14110F" text-anchor="middle">6</text><text x="566" y="292" font-size="15.5" font-weight="800" fill="#FFFCF6" text-anchor="start">Transition plan</text><text x="566" y="314" font-size="13.5" font-weight="500" fill="#D9D0C2" text-anchor="start">Often 1 to 3 years</text><path d="M616 232V240H144V246" fill="none" stroke="#1A1714" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ar)"/><text x="36" y="392" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Rule 1.17: written notice to every client; consent presumed after 90 days without objection.</text><text x="36" y="410" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Sources: ABA; Ad Astra Equity.</text></svg>
