<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 455" width="760" height="455" role="img" aria-label="Estate planning practice for sale: published value ranges" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Estate planning practice for sale: published value ranges</title><rect width="760" height="455" rx="18" fill="#FFFFFF"/><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EECB6E"/><stop offset="1" stop-color="#C9952F"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1714"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C9952F"/></marker></defs><rect x="36" y="34" width="18" height="3" rx="1.5" fill="#C9952F"/><text x="62" y="40" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.6">SOURCECO RESEARCH</text><text x="36" y="76" font-size="23" font-weight="700" fill="#1A1714" text-anchor="start">What an estate planning practice for sale is worth</text><text x="36" y="102" font-size="15" font-weight="400" fill="#6B625A" text-anchor="start">Published ranges buyers start from.</text><rect x="36" y="132" width="688" height="40" rx="10" fill="#14110F"/><text x="52" y="158" font-size="12" font-weight="700" fill="#D9D0C2" text-anchor="start" letter-spacing="1.2">MEASURE</text><text x="282" y="158" font-size="12" font-weight="700" fill="#EECB6E" text-anchor="start" letter-spacing="1.2">RANGE</text><text x="532" y="158" font-size="12" font-weight="700" fill="#EECB6E" text-anchor="start" letter-spacing="1.2">SOURCE</text><rect x="36" y="182" width="688" height="37" rx="10" fill="#F6F2EC"/><text x="52" y="206" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Revenue rule of thumb</text><text x="282" y="206" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">0.5x to 3.0x gross revenue</text><text x="532" y="206" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Clio</text><rect x="36" y="225" width="688" height="37" rx="10" fill="#FFFFFF"/><text x="52" y="249" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Small-firm sales, revenue</text><text x="282" y="249" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">0.5x to 1.5x</text><text x="532" y="249" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">LeanLaw</text><rect x="36" y="268" width="688" height="56" rx="10" fill="#F6F2EC"/><text x="52" y="292" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Small-firm sales, SDE</text><text x="282" y="292" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">2.5x to 4x; 2.44x to 2.84x</text><text x="532" y="292" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">LeanLaw; Peak Business</text><text x="532" y="311" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Valuation</text><rect x="36" y="330" width="688" height="37" rx="10" fill="#FFFFFF"/><text x="52" y="354" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Larger firms, EBITDA</text><text x="282" y="354" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">3x to 6x</text><text x="532" y="354" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Eton Venture Services</text><text x="36" y="397" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">All via Ad Astra Equity, How to value a law firm (updated June 2026), except Clio. Directional,</text><text x="36" y="415" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">not an appraisal.</text></svg>
