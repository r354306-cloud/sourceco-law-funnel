<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 381" width="760" height="381" role="img" aria-label="Installment payments and earnouts after selling a law practice" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Installment payments and earnouts after selling a law practice</title><rect width="760" height="381" rx="18" fill="#FFFFFF"/><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EECB6E"/><stop offset="1" stop-color="#C9952F"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1714"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C9952F"/></marker></defs><rect x="36" y="34" width="18" height="3" rx="1.5" fill="#C9952F"/><text x="62" y="40" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.6">SOURCECO RESEARCH</text><text x="36" y="76" font-size="23" font-weight="700" fill="#1A1714" text-anchor="start">When deferred payments are taxed</text><text x="36" y="102" font-size="15" font-weight="400" fill="#6B625A" text-anchor="start">Installment sales spread the gain over the years you are paid.</text><rect x="36" y="136" width="219" height="153" rx="16" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/><rect x="56" y="156" width="32" height="5" rx="2.5" fill="#C9952F"/><text x="56.0" y="190" font-size="17" font-weight="800" fill="#1A1714" text-anchor="start">Year of sale</text><text x="56.0" y="218" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">Cash at close. Price</text><text x="56.0" y="239" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">allocated across asset</text><text x="56.0" y="260" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">classes first.</text><rect x="271" y="136" width="219" height="153" rx="16" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/><rect x="291" y="156" width="32" height="5" rx="2.5" fill="#C9952F"/><text x="290.66666666666663" y="190" font-size="17" font-weight="800" fill="#1A1714" text-anchor="start">Later years</text><text x="290.66666666666663" y="218" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">Each payment carries part</text><text x="290.66666666666663" y="239" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">of the gain under the</text><text x="290.66666666666663" y="260" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">installment method.</text><rect x="505" y="136" width="219" height="153" rx="16" fill="#14110F" stroke="#14110F" stroke-width="1.5"/><rect x="525" y="156" width="32" height="5" rx="2.5" fill="#C9952F"/><text x="525.3333333333333" y="190" font-size="17" font-weight="800" fill="#FFFCF6" text-anchor="start">Earnout</text><text x="525.3333333333333" y="218" font-size="14.5" font-weight="400" fill="#D9D0C2" text-anchor="start">Total price unknown at</text><text x="525.3333333333333" y="239" font-size="14.5" font-weight="400" fill="#D9D0C2" text-anchor="start">year end: a contingent</text><text x="525.3333333333333" y="260" font-size="14.5" font-weight="400" fill="#D9D0C2" text-anchor="start">payment sale.</text><text x="36" y="323" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Source: IRS Publication 537, Installment Sales (2025). Inventory cannot use the installment</text><text x="36" y="341" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">method. Not tax advice.</text></svg>
