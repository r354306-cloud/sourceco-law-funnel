<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-label="Broker fee examples on a practice with 1.5 million dollars in revenue" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Broker fee examples on a practice with 1.5 million dollars in revenue</title><rect width="760" height="500" rx="18" fill="#FFFFFF"/><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EECB6E"/><stop offset="1" stop-color="#C9952F"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1714"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C9952F"/></marker></defs><rect x="36" y="34" width="18" height="3" rx="1.5" fill="#C9952F"/><text x="62" y="40" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.6">SOURCECO RESEARCH</text><text x="36" y="76" font-size="23" font-weight="700" fill="#1A1714" text-anchor="start">What a broker fee costs on the same deal</text><text x="36" y="102" font-size="15" font-weight="400" fill="#6B625A" text-anchor="start">Illustration: a practice with $1.5M in fee revenue, sold for $1.5M (1.0x revenue).</text><line x1="300" y1="140" x2="300" y2="384" stroke="#E4DED4" stroke-width="1.2"/><text x="300.0" y="404" font-size="13" font-weight="600" fill="#6B625A" text-anchor="middle">$0</text><line x1="433" y1="140" x2="433" y2="384" stroke="#E4DED4" stroke-width="1.2"/><text x="433.3333333333333" y="404" font-size="13" font-weight="600" fill="#6B625A" text-anchor="middle">$40K</text><line x1="567" y1="140" x2="567" y2="384" stroke="#E4DED4" stroke-width="1.2"/><text x="566.6666666666666" y="404" font-size="13" font-weight="600" fill="#6B625A" text-anchor="middle">$80K</text><line x1="700" y1="140" x2="700" y2="384" stroke="#E4DED4" stroke-width="1.2"/><text x="700.0" y="404" font-size="13" font-weight="600" fill="#6B625A" text-anchor="middle">$120K</text><text x="36" y="164" font-size="15.5" font-weight="700" fill="#1A1714" text-anchor="start">Marketplace success fee</text><text x="36" y="186" font-size="13.5" font-weight="400" fill="#6B625A" text-anchor="start">1.5% of seller revenue, paid by buyer</text><rect x="300" y="150" width="75" height="30" rx="15.0" fill="#C9952F"/><text x="385.0" y="171" font-size="15" font-weight="800" fill="#1A1714" text-anchor="start">$22,500</text><text x="36" y="242" font-size="15.5" font-weight="700" fill="#1A1714" text-anchor="start">Seller fee, dental broker</text><text x="36" y="264" font-size="13.5" font-weight="400" fill="#6B625A" text-anchor="start">7% of the selling price, paid by seller</text><rect x="300" y="228" width="350" height="30" rx="15.0" fill="#14110F"/><text x="660.0" y="249" font-size="15" font-weight="800" fill="#1A1714" text-anchor="start">$105,000</text><text x="36" y="320" font-size="15.5" font-weight="700" fill="#1A1714" text-anchor="start">Buyer fee, dental broker</text><text x="36" y="342" font-size="13.5" font-weight="400" fill="#6B625A" text-anchor="start">3% of the selling price, paid by buyer</text><rect x="300" y="306" width="150" height="30" rx="15.0" fill="#D9D0C2"/><text x="460.0" y="327" font-size="15" font-weight="800" fill="#1A1714" text-anchor="start">$45,000</text><text x="36" y="440" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Sources: The Law Practice Exchange (1.5% buyer success fee on seller revenue, $5,000 minimum);</text><text x="36" y="458" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">PARAGON, a dental practice broker (7% seller, 3% buyer). Illustrative math, not a quote.</text></svg>
