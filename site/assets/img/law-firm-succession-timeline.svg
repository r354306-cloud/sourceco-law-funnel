<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 381" width="760" height="381" role="img" aria-label="Law firm succession planning timeline" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Law firm succession planning timeline</title><rect width="760" height="381" rx="18" fill="#FFFFFF"/><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EECB6E"/><stop offset="1" stop-color="#C9952F"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1714"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C9952F"/></marker></defs><rect x="36" y="34" width="18" height="3" rx="1.5" fill="#C9952F"/><text x="62" y="40" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.6">SOURCECO RESEARCH</text><text x="36" y="76" font-size="23" font-weight="700" fill="#1A1714" text-anchor="start">A succession planning timeline</text><text x="36" y="102" font-size="15" font-weight="400" fill="#6B625A" text-anchor="start">Start years ahead. The emergency plan comes first.</text><rect x="36" y="136" width="160" height="153" rx="16" fill="#14110F" stroke="#14110F" stroke-width="1.5"/><rect x="56" y="156" width="32" height="5" rx="2.5" fill="#C9952F"/><text x="56.0" y="190" font-size="17" font-weight="800" fill="#FFFCF6" text-anchor="start">This month</text><text x="56.0" y="218" font-size="14.5" font-weight="400" fill="#D9D0C2" text-anchor="start">Name a designated</text><text x="56.0" y="239" font-size="14.5" font-weight="400" fill="#D9D0C2" text-anchor="start">lawyer and a</text><text x="56.0" y="260" font-size="14.5" font-weight="400" fill="#D9D0C2" text-anchor="start">backup.</text><rect x="212" y="136" width="160" height="153" rx="16" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/><rect x="232" y="156" width="32" height="5" rx="2.5" fill="#C9952F"/><text x="232.0" y="190" font-size="17" font-weight="800" fill="#1A1714" text-anchor="start">This year</text><text x="232.0" y="218" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">Write the plan; get</text><text x="232.0" y="239" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">a directional</text><text x="232.0" y="260" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">value.</text><rect x="388" y="136" width="160" height="153" rx="16" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/><rect x="408" y="156" width="32" height="5" rx="2.5" fill="#C9952F"/><text x="408.0" y="190" font-size="17" font-weight="800" fill="#1A1714" text-anchor="start">12 to 36 months</text><text x="408.0" y="218" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">Build transferable</text><text x="408.0" y="239" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">goodwill before a</text><text x="408.0" y="260" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">sale.</text><rect x="564" y="136" width="160" height="153" rx="16" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/><rect x="584" y="156" width="32" height="5" rx="2.5" fill="#C9952F"/><text x="584.0" y="190" font-size="17" font-weight="800" fill="#1A1714" text-anchor="start">After a sale</text><text x="584.0" y="218" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">Stay 1 to 3 years</text><text x="584.0" y="239" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">as of counsel.</text><text x="36" y="323" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Sources: Illinois ARDC (Rule 1.3, Comment 5); Ad Astra Equity (12 to 36 months; 1 to 3 years as of</text><text x="36" y="341" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">counsel).</text></svg>
