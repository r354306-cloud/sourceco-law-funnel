<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-label="How a law firm sale price splits between cash at close, rollover and earnout" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>How a law firm sale price splits between cash at close, rollover and earnout</title><rect width="760" height="480" rx="18" fill="#FFFFFF"/><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EECB6E"/><stop offset="1" stop-color="#C9952F"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1714"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C9952F"/></marker></defs><rect x="36" y="34" width="18" height="3" rx="1.5" fill="#C9952F"/><text x="62" y="40" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.6">SOURCECO RESEARCH</text><text x="36" y="76" font-size="23" font-weight="700" fill="#1A1714" text-anchor="start">Where the price goes: cash, rollover, earnout</text><text x="36" y="102" font-size="15" font-weight="400" fill="#6B625A" text-anchor="start">One published 2026 example, and the shape of a smaller staged deal.</text><text x="36" y="146" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.4">INVESTOR DEAL: $15M EBITDA AT 6X = $90M</text><rect x="36" y="160" width="482" height="52" rx="10" fill="url(#gg)"/><text x="52" y="192" font-size="15.5" font-weight="800" fill="#1A1714" text-anchor="start">70% cash at close, about $63M pre-tax</text><rect x="522" y="160" width="202" height="52" rx="10" fill="#14110F"/><text x="535.5999999999999" y="192" font-size="15" font-weight="800" fill="#FFFCF6" text-anchor="start">30% rollover equity</text><text x="36" y="262" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.4">SMALLER RULE 1.17 SALE: STAGED ON RETAINED FEES (SHAPE ONLY)</text><rect x="36" y="310" width="110" height="70" rx="8" fill="#C9952F"/><text x="91" y="402" font-size="13.5" font-weight="600" fill="#3F3B36" text-anchor="middle">At close</text><rect x="200" y="336" width="110" height="44" rx="8" fill="#D9D0C2"/><text x="255" y="402" font-size="13.5" font-weight="600" fill="#3F3B36" text-anchor="middle">Year 1</text><rect x="330" y="342" width="110" height="38" rx="8" fill="#D9D0C2"/><text x="385" y="402" font-size="13.5" font-weight="600" fill="#3F3B36" text-anchor="middle">Year 2</text><rect x="460" y="350" width="110" height="30" rx="8" fill="#D9D0C2"/><text x="515" y="402" font-size="13.5" font-weight="600" fill="#3F3B36" text-anchor="middle">Year 3</text><rect x="590" y="350" width="110" height="30" rx="8" fill="none" stroke="#6B625A" stroke-dasharray="4 4"/><text x="645" y="402" font-size="13.5" font-weight="600" fill="#3F3B36" text-anchor="middle">Cap reached</text><line x1="30" y1="380" x2="724" y2="380" stroke="#1A1714" stroke-width="1.5"/><text x="36" y="300" font-size="14" font-weight="600" fill="#3F3B36" text-anchor="start">Earnout payments limited in amount and in time (NYSBA Opinion 961)</text><text x="36" y="438" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Sources: Private Equity Legal Alliance 2026 PI guide (70/30 example); Ad Astra Equity (staged,</text><text x="36" y="456" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">contingent on retained revenue); NYSBA Opinion 961. Bar heights are illustrative.</text></svg>
