<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 437" width="760" height="437" role="img" aria-label="Law firm succession plan exit options" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Law firm succession plan exit options</title><rect width="760" height="437" rx="18" fill="#FFFFFF"/><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EECB6E"/><stop offset="1" stop-color="#C9952F"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1714"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C9952F"/></marker></defs><rect x="36" y="34" width="18" height="3" rx="1.5" fill="#C9952F"/><text x="62" y="40" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.6">SOURCECO RESEARCH</text><text x="36" y="76" font-size="23" font-weight="700" fill="#1A1714" text-anchor="start">Succession plan exit options</text><text x="36" y="102" font-size="15" font-weight="400" fill="#6B625A" text-anchor="start">Sell, merge, hand over or close.</text><rect x="36" y="132" width="688" height="40" rx="10" fill="#14110F"/><text x="52" y="158" font-size="12" font-weight="700" fill="#D9D0C2" text-anchor="start" letter-spacing="1.2">OPTION</text><text x="242" y="158" font-size="12" font-weight="700" fill="#EECB6E" text-anchor="start" letter-spacing="1.2">WHAT TRANSFERS</text><text x="462" y="158" font-size="12" font-weight="700" fill="#EECB6E" text-anchor="start" letter-spacing="1.2">GOOD TO KNOW</text><rect x="36" y="182" width="688" height="56" rx="10" fill="#F6F2EC"/><text x="52" y="206" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Sell (Rule 1.17)</text><text x="242" y="206" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Practice and goodwill</text><text x="462" y="206" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Written client notice; no fee</text><text x="462" y="225" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">increase</text><rect x="36" y="244" width="688" height="37" rx="10" fill="#FFFFFF"/><text x="52" y="268" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Merge</text><text x="242" y="268" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Clients and staff move</text><text x="462" y="268" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">59 law firm mergers in 2025</text><rect x="36" y="287" width="688" height="37" rx="10" fill="#F6F2EC"/><text x="52" y="311" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Internal successor</text><text x="242" y="311" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Ownership over time</text><text x="462" y="311" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Relationships stay in the building</text><rect x="36" y="330" width="688" height="37" rx="10" fill="#FFFFFF"/><text x="52" y="354" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Close</text><text x="242" y="354" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Nothing of value</text><text x="462" y="354" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Return files; keep tail coverage</text><text x="36" y="397" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Sources: ABA Model Rule 1.17; Fairfax Associates 2025 year-end report; Lawyers Mutual NC.</text></svg>
