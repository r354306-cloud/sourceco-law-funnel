<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-label="Family law practice valuation methods: income, market and asset approaches" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Family law practice valuation methods: income, market and asset approaches</title><rect width="760" height="450" rx="18" fill="#FFFFFF"/><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EECB6E"/><stop offset="1" stop-color="#C9952F"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1714"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C9952F"/></marker></defs><rect x="36" y="34" width="18" height="3" rx="1.5" fill="#C9952F"/><text x="62" y="40" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.6">SOURCECO RESEARCH</text><text x="36" y="76" font-size="23" font-weight="700" fill="#1A1714" text-anchor="start">Family law practice valuation methods</text><text x="36" y="102" font-size="15" font-weight="400" fill="#6B625A" text-anchor="start">Three ways buyers and valuers put a number on a practice.</text><rect x="36" y="132" width="688" height="40" rx="10" fill="#14110F"/><text x="52" y="158" font-size="12" font-weight="700" fill="#D9D0C2" text-anchor="start" letter-spacing="1.2">APPROACH</text><text x="242" y="158" font-size="12" font-weight="700" fill="#EECB6E" text-anchor="start" letter-spacing="1.2">WHAT IT MEASURES</text><text x="492" y="158" font-size="12" font-weight="700" fill="#EECB6E" text-anchor="start" letter-spacing="1.2">IN A PRACTICE SALE</text><rect x="36" y="182" width="688" height="56" rx="10" fill="#F6F2EC"/><text x="52" y="206" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Income approach</text><text x="242" y="206" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Future earnings, capitalized or</text><text x="242" y="225" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">discounted</text><text x="492" y="206" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Probably the most widely used</text><text x="492" y="225" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">method for a law practice sale</text><rect x="36" y="244" width="688" height="56" rx="10" fill="#FFFFFF"/><text x="52" y="268" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Market approach</text><text x="242" y="268" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">What comparable practices sold</text><text x="242" y="287" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">for</text><text x="492" y="268" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Rules of thumb on revenue: 0.5x</text><text x="492" y="287" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">to 3.0x</text><rect x="36" y="306" width="688" height="56" rx="10" fill="#F6F2EC"/><text x="52" y="330" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Cost or asset approach</text><text x="242" y="330" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Tangible assets less liabilities</text><text x="492" y="330" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Misses goodwill, the core of a</text><text x="492" y="349" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">practice</text><text x="36" y="392" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Sources: Lawyers Mutual NC, Selling your law practice; Clio, Law firm valuation rule of thumb.</text><text x="36" y="410" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Directional, not an appraisal.</text></svg>
