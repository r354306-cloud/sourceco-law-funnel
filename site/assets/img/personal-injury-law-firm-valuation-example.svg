<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 526" width="760" height="526" role="img" aria-label="Personal injury law firm valuation worked example" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Personal injury law firm valuation worked example</title><rect width="760" height="526" rx="18" fill="#FFFFFF"/><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EECB6E"/><stop offset="1" stop-color="#C9952F"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1714"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C9952F"/></marker></defs><rect x="36" y="34" width="18" height="3" rx="1.5" fill="#C9952F"/><text x="62" y="40" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.6">SOURCECO RESEARCH</text><text x="36" y="76" font-size="23" font-weight="700" fill="#1A1714" text-anchor="start">Personal injury law firm valuation, worked example</text><text x="36" y="102" font-size="15" font-weight="400" fill="#6B625A" text-anchor="start">Illustrative firm: $3.0M in fees, one founding partner, replacement salary of $500K.</text><rect x="40" y="184" width="88" height="216" rx="8" fill="#D9D0C2"/><text x="84" y="174.0" font-size="15" font-weight="800" fill="#1A1714" text-anchor="middle">$3.0M</text><text x="84" y="424" font-size="14" font-weight="600" fill="#3F3B36" text-anchor="middle">Fee</text><text x="84" y="442" font-size="14" font-weight="600" fill="#3F3B36" text-anchor="middle">revenue</text><line x1="128" y1="299" x2="156" y2="299" stroke="#6B625A" stroke-dasharray="3 3"/><rect x="156" y="299" width="88" height="101" rx="8" fill="#D9D0C2"/><text x="200" y="289.2" font-size="15" font-weight="800" fill="#1A1714" text-anchor="middle">$1.4M</text><text x="200" y="424" font-size="14" font-weight="600" fill="#3F3B36" text-anchor="middle">Profit before</text><text x="200" y="442" font-size="14" font-weight="600" fill="#3F3B36" text-anchor="middle">partner pay</text><line x1="244" y1="299" x2="272" y2="299" stroke="#6B625A" stroke-dasharray="3 3"/><rect x="272" y="299" width="88" height="36" rx="8" fill="#E9B9AA"/><text x="316" y="289.2" font-size="15" font-weight="800" fill="#1A1714" text-anchor="middle">minus $500K</text><text x="316" y="424" font-size="14" font-weight="600" fill="#3F3B36" text-anchor="middle">Replacement</text><text x="316" y="442" font-size="14" font-weight="600" fill="#3F3B36" text-anchor="middle">salary</text><line x1="360" y1="335" x2="388" y2="335" stroke="#6B625A" stroke-dasharray="3 3"/><rect x="388" y="335" width="88" height="65" rx="8" fill="#C9952F"/><text x="432" y="325.2" font-size="15" font-weight="800" fill="#1A1714" text-anchor="middle">$900K</text><text x="432" y="424" font-size="14" font-weight="600" fill="#3F3B36" text-anchor="middle">Adjusted</text><text x="432" y="442" font-size="14" font-weight="600" fill="#3F3B36" text-anchor="middle">EBITDA</text><line x1="28" y1="400" x2="500" y2="400" stroke="#1A1714" stroke-width="1.5"/><path d="M504 368H526" stroke="#1A1714" stroke-width="2" marker-end="url(#ar)"/><rect x="530" y="200" width="196" height="170" rx="16" fill="#14110F"/><text x="550" y="232" font-size="12.5" font-weight="700" fill="#EECB6E" text-anchor="start" letter-spacing="1.4">AT 3X TO 5X EBITDA</text><text x="550" y="272" font-size="28" font-weight="800" fill="#FFFCF6" text-anchor="start">$2.7M to</text><text x="550" y="306" font-size="28" font-weight="800" fill="#FFFCF6" text-anchor="start">$4.5M</text><text x="550" y="336" font-size="13.5" font-weight="400" fill="#D9D0C2" text-anchor="start">Plus open case inventory,</text><text x="550" y="355" font-size="13.5" font-weight="400" fill="#D9D0C2" text-anchor="start">paid as cases resolve</text><text x="36" y="484" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Multiples: Private Equity Legal Alliance 2026 guide. Owner pay normalization: CSuite Financial</text><text x="36" y="502" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Partners. Not an appraisal.</text></svg>
