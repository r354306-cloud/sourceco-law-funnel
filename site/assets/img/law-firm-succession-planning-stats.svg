<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 418" width="760" height="418" role="img" aria-label="Law firm succession planning statistics" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Law firm succession planning statistics</title><rect width="760" height="418" rx="18" fill="#FFFFFF"/><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EECB6E"/><stop offset="1" stop-color="#C9952F"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1714"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C9952F"/></marker></defs><rect x="36" y="34" width="18" height="3" rx="1.5" fill="#C9952F"/><text x="62" y="40" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.6">SOURCECO RESEARCH</text><text x="36" y="76" font-size="23" font-weight="700" fill="#1A1714" text-anchor="start">Law firm succession planning by the numbers</text><text x="36" y="102" font-size="15" font-weight="400" fill="#6B625A" text-anchor="start">Most firms have no plan, and the profession is aging.</text><rect x="36" y="136" width="219" height="190" rx="16" fill="#14110F" stroke="#14110F" stroke-width="1.5"/><text x="58.0" y="200" font-size="44" font-weight="800" fill="#EECB6E" text-anchor="start">37%</text><text x="58.0" y="238" font-size="14.5" font-weight="400" fill="#D9D0C2" text-anchor="start">of firms had or were</text><text x="58.0" y="259" font-size="14.5" font-weight="400" fill="#D9D0C2" text-anchor="start">building a succession plan</text><text x="58.0" y="280" font-size="14.5" font-weight="400" fill="#D9D0C2" text-anchor="start">(2018)</text><rect x="271" y="136" width="219" height="190" rx="16" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/><text x="292.66666666666663" y="200" font-size="44" font-weight="800" fill="#1A1714" text-anchor="start">14%</text><text x="292.66666666666663" y="238" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">of US lawyers were 65 or</text><text x="292.66666666666663" y="259" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">older (2021)</text><rect x="505" y="136" width="219" height="190" rx="16" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/><text x="527.3333333333333" y="200" font-size="44" font-weight="800" fill="#1A1714" text-anchor="start">63%</text><text x="527.3333333333333" y="238" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">of firms have lawyers over</text><text x="527.3333333333333" y="259" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">60 controlling 25%+ of</text><text x="527.3333333333333" y="280" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">revenue</text><text x="36" y="360" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Sources: Thomson Reuters 2018 survey via Clio; ABA Profile of the Legal Profession 2021; Citizens,</text><text x="36" y="378" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Aug 2025.</text></svg>
