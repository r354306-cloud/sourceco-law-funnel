<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" role="img" aria-label="How a law firm MSO gets paid" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>How a law firm MSO gets paid</title><rect width="760" height="424" rx="18" fill="#FFFFFF"/><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EECB6E"/><stop offset="1" stop-color="#C9952F"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1714"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C9952F"/></marker></defs><rect x="36" y="34" width="18" height="3" rx="1.5" fill="#C9952F"/><text x="62" y="40" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.6">SOURCECO RESEARCH</text><text x="36" y="76" font-size="23" font-weight="700" fill="#1A1714" text-anchor="start">How a law firm MSO gets paid</text><text x="36" y="102" font-size="15" font-weight="400" fill="#6B625A" text-anchor="start">The services agreement sets the fee. Some fee designs are restricted by state.</text><rect x="36" y="138" width="216" height="210" rx="16" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/><rect x="56" y="158" width="36" height="5" rx="2.5" fill="#C9952F"/><text x="56" y="194" font-size="19" font-weight="800" fill="#1A1714" text-anchor="start">Flat fee</text><text x="56" y="224" font-size="15" font-weight="400" fill="#3F3B36" text-anchor="start">Fixed regardless of</text><text x="56" y="246" font-size="15" font-weight="400" fill="#3F3B36" text-anchor="start">firm performance.</text><text x="56" y="268" font-size="15" font-weight="400" fill="#3F3B36" text-anchor="start">Required in California</text><text x="56" y="290" font-size="15" font-weight="400" fill="#3F3B36" text-anchor="start">MSO arrangements.</text><rect x="56" y="306" width="146" height="28" rx="14" fill="#FBF3DF"/><text x="69" y="325" font-size="13.5" font-weight="700" fill="#8F6823" text-anchor="start">Generally safer</text><rect x="272" y="138" width="216" height="210" rx="16" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/><rect x="292" y="158" width="36" height="5" rx="2.5" fill="#C9952F"/><text x="292" y="194" font-size="19" font-weight="800" fill="#1A1714" text-anchor="start">Cost-plus</text><text x="292" y="224" font-size="15" font-weight="400" fill="#3F3B36" text-anchor="start">Operating costs plus</text><text x="292" y="246" font-size="15" font-weight="400" fill="#3F3B36" text-anchor="start">a margin: 15% in one</text><text x="292" y="268" font-size="15" font-weight="400" fill="#3F3B36" text-anchor="start">L.E.K. example.</text><text x="292" y="290" font-size="15" font-weight="400" fill="#3F3B36" text-anchor="start"></text><rect x="292" y="306" width="130" height="28" rx="14" fill="#FBF3DF"/><text x="305" y="325" font-size="13.5" font-weight="700" fill="#8F6823" text-anchor="start">Common design</text><rect x="508" y="138" width="216" height="210" rx="16" fill="#14110F" stroke="#14110F" stroke-width="1.5"/><rect x="528" y="158" width="36" height="5" rx="2.5" fill="#B4472F"/><text x="528" y="194" font-size="19" font-weight="800" fill="#FFFCF6" text-anchor="start">Share of revenue</text><text x="528" y="224" font-size="15" font-weight="400" fill="#D9D0C2" text-anchor="start">A percentage of fee</text><text x="528" y="246" font-size="15" font-weight="400" fill="#D9D0C2" text-anchor="start">revenue. Improper fee</text><text x="528" y="268" font-size="15" font-weight="400" fill="#D9D0C2" text-anchor="start">splitting in Texas;</text><text x="528" y="290" font-size="15" font-weight="400" fill="#D9D0C2" text-anchor="start">restricted in CO, IL.</text><rect x="528" y="306" width="106" height="28" rx="14" fill="#5A2A1E"/><text x="541" y="325" font-size="13.5" font-weight="700" fill="#FFC9B8" text-anchor="start">Restricted</text><text x="36" y="382" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Sources: L.E.K. 2026; Sidley 2025; Holland and Knight on Texas Opinion 706, Colorado HB26-1421,</text><text x="36" y="400" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Illinois HB 5487.</text></svg>
