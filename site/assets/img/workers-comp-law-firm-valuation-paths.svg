<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-label="Workers comp law firm valuation paths and published multiples" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Workers comp law firm valuation paths and published multiples</title><rect width="760" height="450" rx="18" fill="#FFFFFF"/><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EECB6E"/><stop offset="1" stop-color="#C9952F"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1714"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C9952F"/></marker></defs><rect x="36" y="34" width="18" height="3" rx="1.5" fill="#C9952F"/><text x="62" y="40" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.6">SOURCECO RESEARCH</text><text x="36" y="76" font-size="23" font-weight="700" fill="#1A1714" text-anchor="start">Workers comp law firm valuation: two paths</text><text x="36" y="102" font-size="15" font-weight="400" fill="#6B625A" text-anchor="start">Smaller practices sell on fees. Profitable firms sell on adjusted EBITDA.</text><rect x="36" y="132" width="688" height="40" rx="10" fill="#14110F"/><text x="52" y="158" font-size="12" font-weight="700" fill="#D9D0C2" text-anchor="start" letter-spacing="1.2">PATH</text><text x="202" y="158" font-size="12" font-weight="700" fill="#EECB6E" text-anchor="start" letter-spacing="1.2">BUYER</text><text x="372" y="158" font-size="12" font-weight="700" fill="#EECB6E" text-anchor="start" letter-spacing="1.2">PRICED ON</text><text x="522" y="158" font-size="12" font-weight="700" fill="#EECB6E" text-anchor="start" letter-spacing="1.2">PUBLISHED RANGE</text><rect x="36" y="182" width="688" height="56" rx="10" fill="#F6F2EC"/><text x="52" y="206" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Rule 1.17 sale</text><text x="202" y="206" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Another lawyer or firm</text><text x="372" y="206" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Fee revenue or SDE</text><text x="522" y="206" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">0.5x to 1.5x revenue; 2.5x</text><text x="522" y="225" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">to 4x SDE</text><rect x="36" y="244" width="688" height="56" rx="10" fill="#FFFFFF"/><text x="52" y="268" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Smaller firm,</text><text x="52" y="287" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">EBITDA</text><text x="202" y="268" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Firm or investor</text><text x="202" y="287" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">platform</text><text x="372" y="268" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Adjusted EBITDA</text><text x="522" y="268" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">3x to 5x</text><rect x="36" y="306" width="688" height="56" rx="10" fill="#F6F2EC"/><text x="52" y="330" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Largest PI</text><text x="52" y="349" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">platforms</text><text x="202" y="330" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Investor-backed</text><text x="202" y="349" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">platform</text><text x="372" y="330" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Adjusted EBITDA</text><text x="522" y="330" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">7x to 10x</text><text x="36" y="392" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Sources: LeanLaw via Ad Astra Equity (revenue and SDE); Private Equity Legal Alliance 2026 guide</text><text x="36" y="410" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">(EBITDA). Directional, not an appraisal.</text></svg>
