<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 494" width="760" height="494" role="img" aria-label="Law firm MSO structure" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Law firm MSO structure</title><rect width="760" height="494" rx="18" fill="#FFFFFF"/><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EECB6E"/><stop offset="1" stop-color="#C9952F"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1714"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C9952F"/></marker></defs><rect x="36" y="34" width="18" height="3" rx="1.5" fill="#C9952F"/><text x="62" y="40" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.6">SOURCECO RESEARCH</text><text x="36" y="76" font-size="23" font-weight="700" fill="#1A1714" text-anchor="start">Law firm MSO structure</text><text x="36" y="102" font-size="15" font-weight="400" fill="#6B625A" text-anchor="start">The law firm stays lawyer-owned. Investors own the services company.</text><rect x="36" y="140" width="240" height="70" rx="14" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/><text x="52" y="170" font-size="16" font-weight="700" fill="#1A1714" text-anchor="start">Partner attorneys</text><text x="52" y="191" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">own 100% of the law firm</text><rect x="484" y="140" width="240" height="70" rx="14" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/><text x="500" y="170" font-size="16" font-weight="700" fill="#1A1714" text-anchor="start">Investors</text><text x="500" y="191" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">buy into the services company</text><rect x="36" y="268" width="270" height="150" rx="16" fill="#FBF3DF" stroke="#C9952F" stroke-width="2.5"/><text x="56" y="300" font-size="19" font-weight="800" fill="#1A1714" text-anchor="start">Law firm</text><text x="56" y="328" font-size="15" font-weight="400" fill="#3F3B36" text-anchor="start">Clients, cases, legal judgment</text><text x="56" y="350" font-size="15" font-weight="400" fill="#3F3B36" text-anchor="start">Attorneys and fee revenue</text><rect x="56" y="374" width="186" height="28" rx="14" fill="#FFFFFF" stroke="#C9952F"/><text x="70" y="393" font-size="13.5" font-weight="700" fill="#8F6823" text-anchor="start">Rule 5.4: lawyer-owned</text><rect x="454" y="268" width="270" height="150" rx="16" fill="#14110F"/><text x="474" y="300" font-size="19" font-weight="800" fill="#FFFCF6" text-anchor="start">Services company (MSO)</text><text x="474" y="328" font-size="15" font-weight="400" fill="#D9D0C2" text-anchor="start">Marketing, intake, technology</text><text x="474" y="350" font-size="15" font-weight="400" fill="#D9D0C2" text-anchor="start">HR, finance, staff, leases</text><rect x="474" y="374" width="214" height="28" rx="14" fill="#2A241F" stroke="#C9952F"/><text x="488" y="393" font-size="13.5" font-weight="700" fill="#EECB6E" text-anchor="start">Sellers often roll equity here</text><path d="M156 212V264" stroke="#1A1714" stroke-width="2" marker-end="url(#ar)"/><path d="M604 212V264" stroke="#1A1714" stroke-width="2" marker-end="url(#ar)"/><path d="M310 318H450" stroke="#C9952F" stroke-width="2.5" marker-end="url(#arg)"/><text x="380" y="306" font-size="13.5" font-weight="700" fill="#1A1714" text-anchor="middle">flat or cost-plus fee</text><path d="M450 372H310" stroke="#1A1714" stroke-width="2" marker-end="url(#ar)"/><text x="380" y="392" font-size="13.5" font-weight="600" fill="#3F3B36" text-anchor="middle">staff, systems</text><text x="36" y="452" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Illustrative. Colorado, Illinois and Texas restrict services fees tied to revenue or profits.</text><text x="36" y="470" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Sources: Sidley 2025; L.E.K. 2026.</text></svg>
