<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 488" width="760" height="488" role="img" aria-label="Florida workers compensation attorney fee schedule and the SSA fee agreement cap" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Florida workers compensation attorney fee schedule and the SSA fee agreement cap</title><rect width="760" height="488" rx="18" fill="#FFFFFF"/><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EECB6E"/><stop offset="1" stop-color="#C9952F"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1714"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C9952F"/></marker></defs><rect x="36" y="34" width="18" height="3" rx="1.5" fill="#C9952F"/><text x="62" y="40" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.6">SOURCECO RESEARCH</text><text x="36" y="76" font-size="23" font-weight="700" fill="#1A1714" text-anchor="start">Fees are set by law, not by the firm</text><text x="36" y="102" font-size="15" font-weight="400" fill="#6B625A" text-anchor="start">Florida workers comp schedule and the federal SSD fee agreement cap.</text><text x="36" y="140" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.4">FLORIDA 440.34: SHARE OF BENEFITS SECURED</text><text x="36" y="177" font-size="15" font-weight="700" fill="#1A1714" text-anchor="start">First $5,000</text><rect x="230" y="158" width="180" height="28" rx="14.0" fill="url(#gg)"/><text x="420" y="178" font-size="15" font-weight="800" fill="#1A1714" text-anchor="start">20%</text><text x="36" y="223" font-size="15" font-weight="700" fill="#1A1714" text-anchor="start">Next $5,000</text><rect x="230" y="204" width="135" height="28" rx="14.0" fill="#C9952F"/><text x="375" y="224" font-size="15" font-weight="800" fill="#1A1714" text-anchor="start">15%</text><text x="36" y="269" font-size="15" font-weight="700" fill="#1A1714" text-anchor="start">Rest, first 10 years</text><rect x="230" y="250" width="90" height="28" rx="14.0" fill="#C9952F"/><text x="330" y="270" font-size="15" font-weight="800" fill="#1A1714" text-anchor="start">10%</text><text x="36" y="315" font-size="15" font-weight="700" fill="#1A1714" text-anchor="start">After 10 years</text><rect x="230" y="296" width="45" height="28" rx="14.0" fill="#D9D0C2"/><text x="285" y="316" font-size="15" font-weight="800" fill="#1A1714" text-anchor="start">5%</text><rect x="500" y="132" width="224" height="200" rx="16" fill="#14110F"/><text x="520" y="164" font-size="12.5" font-weight="700" fill="#EECB6E" text-anchor="start" letter-spacing="1.4">SSD FEE AGREEMENT CAP</text><text x="520" y="206" font-size="26" font-weight="800" fill="#FFFCF6" text-anchor="start">25% or</text><text x="520" y="240" font-size="30" font-weight="800" fill="#FFFCF6" text-anchor="start">$9,200</text><text x="520" y="270" font-size="13.5" font-weight="400" fill="#D9D0C2" text-anchor="start">whichever is less, for</text><text x="520" y="289" font-size="13.5" font-weight="400" fill="#D9D0C2" text-anchor="start">favorable decisions on or</text><text x="520" y="308" font-size="13.5" font-weight="400" fill="#D9D0C2" text-anchor="start">after Nov 30, 2024</text><rect x="36" y="352" width="688" height="62" rx="14" fill="#F6F2EC"/><text x="56" y="378" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Worked example: $20,000 of benefits secured in Florida, first 10 years</text><text x="56" y="400" font-size="14" font-weight="400" fill="#3F3B36" text-anchor="start">$1,000 + $750 + $1,000 = $2,750 attorney fee, approved by a judge of compensation claims</text><text x="36" y="446" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Sources: Florida Statutes 440.34 (2024); Social Security Administration, Fee agreements. New York</text><text x="36" y="464" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">fees are approved by the Workers' Compensation Board.</text></svg>
