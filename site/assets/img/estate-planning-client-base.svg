font-weight="400" fill="#3F3B36" text-anchor="start">trusts.</text><rect x="212" y="136" width="160" height="174" rx="16" fill="#14110F" stroke="#14110F" stroke-width="1.5"/><rect x="232" y="156" width="32" height="5" rx="2.5" fill="#C9952F"/><text x="232.0" y="190" font-size="17" font-weight="800" fill="#FFFCF6" text-anchor="start">Administration</text><text x="232.0" y="218" font-size="14.5" font-weight="400" fill="#D9D0C2" text-anchor="start">Trust and estate</text><text x="232.0" y="239" font-size="14.5" font-weight="400" fill="#D9D0C2" text-anchor="start">administration and</text><text x="232.0" y="260" font-size="14.5" font-weight="400" fill="#D9D0C2" text-anchor="start">probate for</text><text x="232.0" y="281" font-size="14.5" font-weight="400" fill="#D9D0C2" text-anchor="start">families you serve.</text><rect x="388" y="136" width="160" height="174" rx="16" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/><rect x="408" y="156" width="32" height="5" rx="2.5" fill="#C9952F"/><text x="408.0" y="190" font-size="17" font-weight="800" fill="#1A1714" text-anchor="start">Will inventory</text><text x="408.0" y="218" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">Original documents</text><text x="408.0" y="239" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">held, and the duty</text><text x="408.0" y="260" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">to notify</text><text x="408.0" y="281" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">testators.</text><rect x="564" y="136" width="160" height="174" rx="16" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/><rect x="584" y="156" width="32" height="5" rx="2.5" fill="#C9952F"/><text x="584.0" y="190" font-size="17" font-weight="800" fill="#1A1714" text-anchor="start">Referral partners</text><text x="584.0" y="218" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">Advisors and CPAs</text><text x="584.0" y="239" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">who keep sending</text><text x="584.0" y="260" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">work to the firm.</text><text x="36" y="344" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Olmstead: firms with recurring clients often command better valuations. Clio: buyers weigh repeat</text><text x="36" y="362" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">business and whether clients transfer.</text></svg>
