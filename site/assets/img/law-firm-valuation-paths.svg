<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 492" width="760" height="492" role="img" aria-label="Two paths in a law firm valuation" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Two paths in a law firm valuation</title><rect width="760" height="492" rx="18" fill="#FFFFFF"/><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EECB6E"/><stop offset="1" stop-color="#C9952F"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1714"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C9952F"/></marker></defs><rect x="36" y="34" width="18" height="3" rx="1.5" fill="#C9952F"/><text x="62" y="40" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.6">SOURCECO RESEARCH</text><text x="36" y="76" font-size="23" font-weight="700" fill="#1A1714" text-anchor="start">Two paths in a law firm valuation</text><text x="36" y="102" font-size="15" font-weight="400" fill="#6B625A" text-anchor="start">Profit after paying each partner a replacement salary decides which path a firm takes.</text><text x="36" y="138" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.4">PATH A</text><rect x="36" y="150" width="160" height="104" rx="14" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/><text x="52" y="180" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Under $1M fees</text><text x="52" y="201" font-size="14" font-weight="400" fill="#3F3B36" text-anchor="start">or under $250K</text><text x="52" y="222" font-size="14" font-weight="400" fill="#3F3B36" text-anchor="start">adjusted EBITDA</text><path d="M199 202H213" stroke="#1A1714" stroke-width="2" marker-end="url(#ar)"/><rect x="216" y="150" width="160" height="104" rx="14" fill="#FBF3DF" stroke="#C9952F" stroke-width="2"/><text x="232" y="180" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Priced on annual</text><text x="232" y="201" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">gross revenue</text><text x="232" y="222" font-size="14" font-weight="400" fill="#3F3B36" text-anchor="start">0.5x to 1.5x</text><path d="M379 202H393" stroke="#1A1714" stroke-width="2" marker-end="url(#ar)"/><rect x="396" y="150" width="160" height="104" rx="14" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/><text x="412" y="180" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Buyer: another</text><text x="412" y="201" font-size="14" font-weight="400" fill="#3F3B36" text-anchor="start">attorney or local</text><text x="412" y="222" font-size="14" font-weight="400" fill="#3F3B36" text-anchor="start">firm, Rule 1.17</text><path d="M559 202H573" stroke="#1A1714" stroke-width="2" marker-end="url(#ar)"/><rect x="576" y="150" width="160" height="104" rx="14" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/><text x="592" y="180" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Paid over several</text><text x="592" y="201" font-size="14" font-weight="400" fill="#3F3B36" text-anchor="start">years, earnout on</text><text x="592" y="222" font-size="14" font-weight="400" fill="#3F3B36" text-anchor="start">clients kept</text><text x="36" y="288" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.4">PATH B</text><rect x="36" y="300" width="160" height="104" rx="14" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/><text x="52" y="330" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">$250K or more in</text><text x="52" y="351" font-size="14" font-weight="400" fill="#3F3B36" text-anchor="start">adjusted EBITDA</text><path d="M199 352H213" stroke="#1A1714" stroke-width="2" marker-end="url(#ar)"/><rect x="216" y="300" width="160" height="104" rx="14" fill="#FBF3DF" stroke="#C9952F" stroke-width="2"/><text x="232" y="330" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Priced on adjusted</text><text x="232" y="351" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">EBITDA</text><text x="232" y="372" font-size="14" font-weight="400" fill="#3F3B36" text-anchor="start">3x to 10x</text><path d="M379 352H393" stroke="#1A1714" stroke-width="2" marker-end="url(#ar)"/><rect x="396" y="300" width="160" height="104" rx="14" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/><text x="412" y="330" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Buyer: regional</text><text x="412" y="351" font-size="14" font-weight="400" fill="#3F3B36" text-anchor="start">firm or investor</text><text x="412" y="372" font-size="14" font-weight="400" fill="#3F3B36" text-anchor="start">services platform</text><path d="M559 352H573" stroke="#1A1714" stroke-width="2" marker-end="url(#ar)"/><rect x="576" y="300" width="160" height="104" rx="14" fill="#14110F" stroke="#14110F" stroke-width="1.5"/><text x="592" y="330" font-size="14.5" font-weight="700" fill="#FFFCF6" text-anchor="start">Cash at close plus</text><text x="592" y="351" font-size="14" font-weight="400" fill="#D9D0C2" text-anchor="start">rollover equity</text><text x="592" y="372" font-size="14" font-weight="400" fill="#D9D0C2" text-anchor="start">or an earnout</text><text x="36" y="450" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Sources: Clio; Private Equity Legal Alliance 2026 guide; Ad Astra Equity. Rule 1.17 governs</text><text x="36" y="468" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">lawyer-to-lawyer sales.</text></svg>
