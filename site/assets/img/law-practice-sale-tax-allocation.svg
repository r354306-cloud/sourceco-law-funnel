<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 494" width="760" height="494" role="img" aria-label="How a law practice sale price is allocated on Form 8594" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>How a law practice sale price is allocated on Form 8594</title><rect width="760" height="494" rx="18" fill="#FFFFFF"/><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EECB6E"/><stop offset="1" stop-color="#C9952F"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1714"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C9952F"/></marker></defs><rect x="36" y="34" width="18" height="3" rx="1.5" fill="#C9952F"/><text x="62" y="40" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.6">SOURCECO RESEARCH</text><text x="36" y="76" font-size="23" font-weight="700" fill="#1A1714" text-anchor="start">How the price is allocated on Form 8594</text><text x="36" y="102" font-size="15" font-weight="400" fill="#6B625A" text-anchor="start">Residual method: classes are filled in order. What is left is goodwill.</text><rect x="36" y="140" width="34" height="58" fill="#D9D0C2" stroke="#FFFFFF" stroke-width="2"/><rect x="70" y="140" width="34" height="58" fill="#E9E2D6" stroke="#FFFFFF" stroke-width="2"/><rect x="105" y="140" width="55" height="58" fill="#F6F2EC" stroke="#FFFFFF" stroke-width="2"/><rect x="160" y="140" width="138" height="58" fill="#F1DDB0" stroke="#FFFFFF" stroke-width="2"/><text x="171.84" y="165" font-size="15" font-weight="800" fill="#1A1714" text-anchor="start">Class VI</text><text x="171.84" y="185" font-size="13" font-weight="500" fill="#3F3B36" text-anchor="start">non-compete, other</text><rect x="297" y="140" width="427" height="58" fill="#C9952F" stroke="#FFFFFF" stroke-width="2"/><text x="309.44" y="165" font-size="15" font-weight="800" fill="#1A1714" text-anchor="start">Class VII</text><text x="309.44" y="185" font-size="13" font-weight="500" fill="#3F3B36" text-anchor="start">goodwill and going concern value</text><text x="36" y="224" font-size="13.5" font-weight="400" fill="#6B625A" text-anchor="start">Classes I to V cover cash, traded property, receivables, stock in trade, and furniture and equipment.</text><path d="M36 244H724" stroke="#1A1714" stroke-width="2" marker-end="url(#ar)"/><text x="36" y="266" font-size="13.5" font-weight="600" fill="#3F3B36" text-anchor="start">Consideration is applied left to right; the remainder lands in Class VII</text><rect x="36" y="300" width="336" height="118" rx="14" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/><text x="54" y="332" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.4">SELLER</text><text x="54" y="360" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">Each asset is treated as sold</text><text x="54" y="381" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">separately; its type decides</text><text x="54" y="402" font-size="14.5" font-weight="400" fill="#3F3B36" text-anchor="start">capital or ordinary treatment.</text><rect x="388" y="300" width="336" height="118" rx="14" fill="#14110F" stroke="#14110F" stroke-width="1.5"/><text x="406" y="332" font-size="12.5" font-weight="700" fill="#EECB6E" text-anchor="start" letter-spacing="1.4">BUYER</text><text x="406" y="360" font-size="14.5" font-weight="400" fill="#FFFCF6" text-anchor="start">Goodwill and a non-compete are</text><text x="406" y="381" font-size="14.5" font-weight="400" fill="#FFFCF6" text-anchor="start">section 197 intangibles, deducted</text><text x="406" y="402" font-size="14.5" font-weight="400" fill="#FFFCF6" text-anchor="start">ratably over 15 years.</text><text x="36" y="452" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Sources: IRS Instructions for Form 8594 (Rev. 11/2021); IRS, Sale of a business; 26 U.S.C. 197.</text><text x="36" y="470" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Segment widths are illustrative. Not tax advice.</text></svg>
