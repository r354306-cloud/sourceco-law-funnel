<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 462" width="760" height="462" role="img" aria-label="Law firm succession plan: emergency plan and exit plan checklist" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Law firm succession plan: emergency plan and exit plan checklist</title><rect width="760" height="462" rx="18" fill="#FFFFFF"/><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EECB6E"/><stop offset="1" stop-color="#C9952F"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1714"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C9952F"/></marker></defs><rect x="36" y="34" width="18" height="3" rx="1.5" fill="#C9952F"/><text x="62" y="40" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.6">SOURCECO RESEARCH</text><text x="36" y="76" font-size="23" font-weight="700" fill="#1A1714" text-anchor="start">Two plans in one succession plan</text><text x="36" y="102" font-size="15" font-weight="400" fill="#6B625A" text-anchor="start">The emergency plan protects clients. The exit plan protects the value.</text><rect x="36" y="136" width="336" height="250" rx="16" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/><text x="58" y="170" font-size="13" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.4">EMERGENCY PLAN</text><rect x="58" y="192" width="18" height="18" rx="5" fill="none" stroke="#C9952F" stroke-width="2"/><path d="M62 201l4 4 7-8" fill="none" stroke="#C9952F" stroke-width="2.2"/><text x="88" y="206" font-size="15" font-weight="500" fill="#3F3B36" text-anchor="start">Designated lawyer and backup</text><rect x="58" y="228" width="18" height="18" rx="5" fill="none" stroke="#C9952F" stroke-width="2"/><path d="M62 237l4 4 7-8" fill="none" stroke="#C9952F" stroke-width="2.2"/><text x="88" y="242" font-size="15" font-weight="500" fill="#3F3B36" text-anchor="start">Signed authority to act</text><rect x="58" y="264" width="18" height="18" rx="5" fill="none" stroke="#C9952F" stroke-width="2"/><path d="M62 273l4 4 7-8" fill="none" stroke="#C9952F" stroke-width="2.2"/><text x="88" y="278" font-size="15" font-weight="500" fill="#3F3B36" text-anchor="start">Access: calendar, files, trust</text><rect x="58" y="300" width="18" height="18" rx="5" fill="none" stroke="#C9952F" stroke-width="2"/><path d="M62 309l4 4 7-8" fill="none" stroke="#C9952F" stroke-width="2.2"/><text x="88" y="314" font-size="15" font-weight="500" fill="#3F3B36" text-anchor="start">Client and staff letters</text><rect x="58" y="336" width="18" height="18" rx="5" fill="none" stroke="#C9952F" stroke-width="2"/><path d="M62 345l4 4 7-8" fill="none" stroke="#C9952F" stroke-width="2.2"/><text x="88" y="350" font-size="15" font-weight="500" fill="#3F3B36" text-anchor="start">Inventory attorney, if required</text><rect x="388" y="136" width="336" height="250" rx="16" fill="#14110F" stroke="#14110F" stroke-width="1.5"/><text x="410" y="170" font-size="13" font-weight="700" fill="#EECB6E" text-anchor="start" letter-spacing="1.4">EXIT PLAN</text><rect x="410" y="192" width="18" height="18" rx="5" fill="none" stroke="#C9952F" stroke-width="2"/><path d="M414 201l4 4 7-8" fill="none" stroke="#C9952F" stroke-width="2.2"/><text x="440" y="206" font-size="15" font-weight="500" fill="#FFFCF6" text-anchor="start">Directional value today</text><rect x="410" y="228" width="18" height="18" rx="5" fill="none" stroke="#C9952F" stroke-width="2"/><path d="M414 237l4 4 7-8" fill="none" stroke="#C9952F" stroke-width="2.2"/><text x="440" y="242" font-size="15" font-weight="500" fill="#FFFCF6" text-anchor="start">Sell, merge, successor or close</text><rect x="410" y="264" width="18" height="18" rx="5" fill="none" stroke="#C9952F" stroke-width="2"/><path d="M414 273l4 4 7-8" fill="none" stroke="#C9952F" stroke-width="2.2"/><text x="440" y="278" font-size="15" font-weight="500" fill="#FFFCF6" text-anchor="start">Move client relationships</text><rect x="410" y="300" width="18" height="18" rx="5" fill="none" stroke="#C9952F" stroke-width="2"/><path d="M414 309l4 4 7-8" fill="none" stroke="#C9952F" stroke-width="2.2"/><text x="440" y="314" font-size="15" font-weight="500" fill="#FFFCF6" text-anchor="start">Normalize your pay</text><rect x="410" y="336" width="18" height="18" rx="5" fill="none" stroke="#C9952F" stroke-width="2"/><path d="M414 345l4 4 7-8" fill="none" stroke="#C9952F" stroke-width="2.2"/><text x="440" y="350" font-size="15" font-weight="500" fill="#FFFCF6" text-anchor="start">Tail coverage and taxes</text><text x="36" y="420" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Florida Rule 1-3.8 requires an inventory attorney designation. Rule 1.3, Comment 5 (Illinois,</text><text x="36" y="438" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Colorado): a sole practitioner may need a plan. Lawyers Mutual NC on tail coverage.</text></svg>
