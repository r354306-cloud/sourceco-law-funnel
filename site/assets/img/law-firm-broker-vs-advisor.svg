<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 493" width="760" height="493" role="img" aria-label="Law firm broker vs M&amp;A advisor vs selling on your own" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Law firm broker vs M&amp;A advisor vs selling on your own</title><rect width="760" height="493" rx="18" fill="#FFFFFF"/><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EECB6E"/><stop offset="1" stop-color="#C9952F"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1714"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C9952F"/></marker></defs><rect x="36" y="34" width="18" height="3" rx="1.5" fill="#C9952F"/><text x="62" y="40" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.6">SOURCECO RESEARCH</text><text x="36" y="76" font-size="23" font-weight="700" fill="#1A1714" text-anchor="start">Law firm broker, M&amp;A advisor or going direct</text><text x="36" y="102" font-size="15" font-weight="400" fill="#6B625A" text-anchor="start">Who finds the buyer, who does the work, and who it suits.</text><rect x="36" y="132" width="688" height="40" rx="10" fill="#14110F"/><text x="52" y="158" font-size="12" font-weight="700" fill="#D9D0C2" text-anchor="start" letter-spacing="1.2"></text><text x="202" y="158" font-size="12" font-weight="700" fill="#EECB6E" text-anchor="start" letter-spacing="1.2">LAW FIRM BROKER</text><text x="382" y="158" font-size="12" font-weight="700" fill="#EECB6E" text-anchor="start" letter-spacing="1.2">M&amp;A ADVISOR</text><text x="562" y="158" font-size="12" font-weight="700" fill="#EECB6E" text-anchor="start" letter-spacing="1.2">ON YOUR OWN</text><rect x="36" y="182" width="688" height="56" rx="10" fill="#F6F2EC"/><text x="52" y="206" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Finds buyers</text><text x="202" y="206" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Listings and a buyer</text><text x="202" y="225" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">network</text><text x="382" y="206" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Runs a confidential</text><text x="382" y="225" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">process</text><text x="562" y="206" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">You do</text><rect x="36" y="244" width="688" height="56" rx="10" fill="#FFFFFF"/><text x="52" y="268" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Buyers reached</text><text x="202" y="268" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Mostly attorneys and</text><text x="202" y="287" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">firms</text><text x="382" y="268" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Firms and investor</text><text x="382" y="287" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">platforms</text><text x="562" y="268" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">People you know</text><rect x="36" y="306" width="688" height="37" rx="10" fill="#F6F2EC"/><text x="52" y="330" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Typical fee</text><text x="202" y="330" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Success fee at closing</text><text x="382" y="330" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Success fee or retainer</text><text x="562" y="330" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">None</text><rect x="36" y="349" width="688" height="56" rx="10" fill="#FFFFFF"/><text x="52" y="373" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Best for</text><text x="202" y="373" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Solo and small</text><text x="202" y="392" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">practices</text><text x="382" y="373" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Profitable, larger</text><text x="382" y="392" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">firms</text><text x="562" y="373" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">A known successor</text><text x="36" y="435" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Rule 1.17 applies on every route. Fee examples: The Law Practice Exchange (1.5% buyer success fee</text><text x="36" y="453" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">on seller revenue). Not legal advice.</text></svg>
