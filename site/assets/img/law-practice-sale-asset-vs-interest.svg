<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 469" width="760" height="469" role="img" aria-label="Selling a law practice taxes: asset sale vs selling an ownership interest" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Selling a law practice taxes: asset sale vs selling an ownership interest</title><rect width="760" height="469" rx="18" fill="#FFFFFF"/><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EECB6E"/><stop offset="1" stop-color="#C9952F"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1714"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C9952F"/></marker></defs><rect x="36" y="34" width="18" height="3" rx="1.5" fill="#C9952F"/><text x="62" y="40" font-size="12.5" font-weight="700" fill="#8F6823" text-anchor="start" letter-spacing="1.6">SOURCECO RESEARCH</text><text x="36" y="76" font-size="23" font-weight="700" fill="#1A1714" text-anchor="start">Asset sale or ownership interest?</text><text x="36" y="102" font-size="15" font-weight="400" fill="#6B625A" text-anchor="start">The structure decides how the IRS sees each dollar of the price.</text><rect x="36" y="132" width="688" height="40" rx="10" fill="#14110F"/><text x="52" y="158" font-size="12" font-weight="700" fill="#D9D0C2" text-anchor="start" letter-spacing="1.2">STRUCTURE</text><text x="222" y="158" font-size="12" font-weight="700" fill="#EECB6E" text-anchor="start" letter-spacing="1.2">WHAT YOU SELL</text><text x="452" y="158" font-size="12" font-weight="700" fill="#EECB6E" text-anchor="start" letter-spacing="1.2">GENERAL FEDERAL TREATMENT</text><rect x="36" y="182" width="688" height="75" rx="10" fill="#F6F2EC"/><text x="52" y="206" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Asset sale</text><text x="222" y="206" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Goodwill, files, equipment,</text><text x="222" y="225" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">receivables</text><text x="452" y="206" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Each asset taxed separately by type;</text><text x="452" y="225" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">price allocated by the residual</text><text x="452" y="244" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">method</text><rect x="36" y="263" width="688" height="75" rx="10" fill="#FFFFFF"/><text x="52" y="287" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Partnership or LLC</text><text x="52" y="306" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">interest</text><text x="222" y="287" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Your ownership interest</text><text x="452" y="287" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Usually capital gain; the part tied</text><text x="452" y="306" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">to unrealized receivables is ordinary</text><text x="452" y="325" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">income</text><rect x="36" y="344" width="688" height="37" rx="10" fill="#F6F2EC"/><text x="52" y="368" font-size="14.5" font-weight="700" fill="#1A1714" text-anchor="start">Corporate stock</text><text x="222" y="368" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Your shares</text><text x="452" y="368" font-size="14" font-weight="500" fill="#3F3B36" text-anchor="start">Usually capital gain or loss</text><text x="36" y="411" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">Sources: IRS, Sale of a business; IRS Publication 541 (Rev. 12/2025). General information, not tax</text><text x="36" y="429" font-size="13" font-weight="400" fill="#6B625A" text-anchor="start">advice. Ask a CPA about your entity.</text></svg>
