  function fromRaw(raw){return crypto.subtle.importKey('raw',u8(raw),'AES-GCM',true,['decrypt'])}
  function derive(pw){return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(m){return crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(S),iterations:I,hash:'SHA-256'},m,{name:'AES-GCM',length:256},true,['decrypt'])})}
  function viaSheet(pw){return fetch(B,{method:'POST',body:JSON.stringify({action:'unlock',code:pw,page:location.pathname,ua:navigator.userAgent.slice(0,160)})}).then(function(r){return r.json()}).then(function(j){if(!j||!j.ok||!j.key)throw new Error('denied');return fromRaw(j.key)})}
  function show(){document.getElementById('gate').hidden=false;document.getElementById('pw').focus()}
  var saved=store();
  if(saved){fromRaw(saved).then(dec).then(render).catch(function(){clear();show()})}else{show()}
  document.getElementById('f').addEventListener('submit',function(e){
    e.preventDefault();var err=document.getElementById('err'),go=document.getElementById('go');err.textContent='Checking...';go.disabled=true;
    var rem=document.getElementById('rm').checked,pw=document.getElementById('pw').value.trim();
    (B?viaSheet(pw):derive(pw)).then(function(k){return dec(k).then(function(h){return crypto.subtle.exportKey('raw',k).then(function(raw){save(b(raw),rem);render(h)})})}).catch(function(){go.disabled=false;err.textContent="That passcode didn't work."})
  });
})();
</script>
