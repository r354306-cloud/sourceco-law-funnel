:root{--bg:#FBFAF9;--card:#fff;--ink:#221F1C;--muted:#746A61;--line:#DDD7CD;--gold1:#EECB6E;--gold2:#DDB04F}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;padding:16px}

input[type=password]:focus{outline:2px solid var(--gold2);outline-offset:1px}
